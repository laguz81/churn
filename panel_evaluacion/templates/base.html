<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Panel de evaluación{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --fondo: #f5f6f8;
    --tarjeta: #ffffff;
    --borde: #d9dce1;
    --texto: #1f2430;
    --texto-suave: #5a6270;
    --acento: #2d5be3;
    --acento-suave: #eaf0ff;
    --error: #b3261e;
    --error-fondo: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.5;
  }
  .contenedor {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  .progreso {
    font-weight: 600;
    color: var(--texto-suave);
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .perfil-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    gap: 10px 20px;
  }
  .perfil-item .etiqueta {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-suave);
  }
  .perfil-item .valor { font-size: 1.05rem; font-weight: 600; }
  .opcion-titulo {
    display: inline-block;
    background: var(--acento-suave);
    color: var(--acento);
    font-weight: 700;
    border-radius: 6px;
    padding: 3px 12px;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  .campo { margin-bottom: 10px; }
  .campo .etiqueta {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-suave);
    margin-bottom: 2px;
  }
  .campo .valor { white-space: pre-wrap; }
  fieldset {
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 14px 16px 16px;
    margin: 0 0 18px;
  }
  legend { font-weight: 700; padding: 0 6px; }
  .pregunta { color: var(--texto-suave); margin: 0 0 10px; }
  .anclas { display: flex; flex-direction: column; gap: 8px; }
  .ancla {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .ancla:hover { background: var(--acento-suave); }
  .ancla input { margin-top: 3px; }
  .ancla .num { font-weight: 700; min-width: 1.4em; }
  textarea {
    width: 100%;
    resize: vertical;
    min-height: 70px;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 8px;
    border: 1px solid var(--borde);
    border-radius: 8px;
  }
  .contador { font-size: 0.8rem; color: var(--texto-suave); text-align: right; }
  button.enviar {
    background: var(--acento);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.enviar:hover { opacity: 0.92; }
  .errores {
    background: var(--error-fondo);
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .errores ul { margin: 4px 0 0; padding-left: 20px; }
  .centrado { text-align: center; padding-top: 60px; }
  .zona-prueba {
    margin-top: 24px;
    padding: 14px 16px;
    border: 1px dashed #c9a227;
    border-radius: 10px;
    background: #fff9e8;
  }
  .zona-prueba .pregunta { color: #7a5c00; margin: 0 0 10px; }
  button.reiniciar {
    background: #ffffff;
    color: #b3261e;
    border: 1px solid #b3261e;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.reiniciar:hover { background: #fdecea; }
  footer.version {
    text-align: center;
    color: #9aa0a6;
    font-size: 0.75rem;
    padding: 16px 0 8px;
  }
</style>
</head>
<body>
<div class="contenedor">
{% block contenido %}{% endblock %}
</div>
<footer class="version">v1.0.0</footer>
</body>
</html>
