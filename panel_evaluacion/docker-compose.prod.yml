services:
  panel_evaluacion:
    build: .
    image: panel_evaluacion:latest
    container_name: panel_evaluacion
    restart: unless-stopped
    ports:
      # Solo loopback: nada expuesto a internet directamente en este puerto.
      # nginx (reverse proxy) es el unico punto de entrada publico, en 80/443.
      # Puerto host 8090 (no 8000: ya ocupado por platform-ia en este servidor).
      - "127.0.0.1:8090:8000"
    environment:
      DATOS_DIR: /app/datos
      SECRETO_DIR: /app/secreto
      DB_PATH: /data/respuestas.db
    volumes:
      - ./datos:/app/datos
      - ./secreto:/app/secreto:ro
      - ./data:/data
